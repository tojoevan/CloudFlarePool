name = "cloudflarepool"
main = "src/index.js"
compatibility_date = "2025-08-01"

# account_id 可选：运行 `wrangler login` 后单账号会被自动识别；
# 若账号下有多个 Cloudflare 账户，请取消注释并填入你的 Account ID。
# account_id = "your-cloudflare-account-id"

# data.kapibala.icu — production custom domain for the data lake.
# 前置条件：kapibala.icu 必须已在 Cloudflare 添加为 zone 且 NS 指向 CF，
# 否则 custom_domain 路由创建会失败。
routes = [
  { pattern = "data.kapibala.icu", custom_domain = true }
]

# GIT_HEAD 兜底值：管理后台版本矩阵读它。deploy.sh 部署时用 --var 覆盖为实际 HEAD；
# 此值仅在"手动裸 wrangler deploy（不带 --var）"时生效，防止版本矩阵显示 null（已踩坑 3 次）。
# 发版后请顺手更新为当前短 sha。
[vars]
GIT_HEAD = "ab2c309"

# Single D1 database. Multi-tenancy is logical (tenant_id column), not per-DB.
[[d1_databases]]
binding = "DB"
database_name = "cloudflarepool"
database_id = "dedcbd12-0a39-4451-95b2-c2a3cdf3f452"   # fill after: wrangler d1 create cloudflarepool

# R2 bucket for images / binary blobs.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cloudflarepool"

# Production secret (set once, never committed):
#   wrangler secret put INTERNAL_KEY
# For LOCAL `wrangler dev`, put `INTERNAL_KEY=dev-only-change-me` in .dev.vars
# (git-ignored). Do NOT keep it in [vars] here — a var and a secret binding
# cannot share the same name (Cloudflare rejects "already in use").
#
# ALLOW_SETUP: leave UNSET in production (the /__setup bootstrap stays disabled).
# For local dev you may add `ALLOW_SETUP=1` to .dev.vars.
