<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>微家事 · 管理后台</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <div id="app">
    <!-- 登录 -->
    <section id="login" class="card">
      <h1>微家事</h1>
      <p class="sub">管理后台登录</p>
      <form id="login-form">
        <input id="email" type="email" placeholder="管理员邮箱" autocomplete="username" required />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit" id="login-btn">登录</button>
        <p id="login-err" class="err"></p>
      </form>
    </section>

    <!-- 主界面 -->
    <section id="main" class="card hidden">
      <header class="topbar">
        <div>
          <h1>管理后台</h1>
          <p class="sub" id="who"></p>
        </div>
        <button id="logout" class="ghost">退出</button>
      </header>
      <div id="tenant" class="tenant hidden"></div>
      <div id="cards" class="cards"></div>
      <p class="foot">只读看板 · 数据湖实时统计</p>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
