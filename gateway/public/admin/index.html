<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>微家事 · 管理后台</title>
  <link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <div id="app">
    <!-- 登录 -->
    <section id="login" class="card">
      <h1>微家事</h1>
      <p class="sub">管理后台登录</p>
      <form id="login-form">
        <input id="email" type="email" placeholder="管理员邮箱" autocomplete="username" required />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <button type="submit" id="login-btn">登录</button>
        <p id="login-err" class="err"></p>
      </form>
    </section>

    <!-- 主界面 -->
    <section id="main" class="card hidden">
      <header class="topbar">
        <div>
          <h1>管理后台</h1>
          <p class="sub" id="who"></p>
        </div>
        <button id="logout" class="ghost">退出</button>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="overview">概览</button>
        <button class="tab" data-tab="users">用户账号</button>
        <button class="tab" data-tab="keys">服务密钥</button>
        <button class="tab" data-tab="security">安全</button>
      </nav>

      <!-- 概览 -->
      <div class="panel" id="panel-overview">
        <div id="tenant" class="tenant hidden"></div>
        <div id="cards" class="cards"></div>
        <p class="foot">只读看板 · 数据湖实时统计</p>
      </div>

      <!-- 用户账号 -->
      <div class="panel hidden" id="panel-users">
        <div class="panel-head">
          <h2>用户账号</h2>
          <button class="ghost sm" id="users-refresh">刷新</button>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>邮箱</th><th>状态</th><th>来源</th><th>创建</th><th>操作</th></tr></thead>
            <tbody id="users-body"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- 服务密钥 -->
      <div class="panel hidden" id="panel-keys">
        <div class="panel-head">
          <h2>服务密钥（T3 · MCP/Skill）</h2>
          <button class="primary sm" id="key-issue">签发新密钥</button>
        </div>
        <div id="key-secret" class="secret-box hidden">
          <p class="secret-warn">⚠️ 密钥仅显示一次，请立即复制保存：</p>
          <code id="key-secret-val"></code>
          <button class="ghost sm" id="key-secret-copy">复制</button>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>ID</th><th>作用域</th><th>状态</th><th>创建</th><th>操作</th></tr></thead>
            <tbody id="keys-body"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- 安全 -->
      <div class="panel hidden" id="panel-security">
        <div class="panel-head"><h2>修改管理员密码</h2></div>
        <form id="pw-form" class="form">
          <input id="pw-old" type="password" placeholder="当前密码" autocomplete="current-password" required />
          <input id="pw-new" type="password" placeholder="新密码（≥8 位）" autocomplete="new-password" required />
          <input id="pw-confirm" type="password" placeholder="确认新密码" autocomplete="new-password" required />
          <button type="submit" id="pw-btn">保存</button>
          <p id="pw-msg" class="err"></p>
        </form>
      </div>
    </section>
  </div>
  <footer class="footer">
    <span>微家事 · 管理后台</span>
    <span class="dot">·</span>
    <span id="ver-front">前端 v0.0.1</span>
    <span class="dot">·</span>
    <span id="ver-back">后端 -</span>
  </footer>
  <div id="toast" class="toast hidden"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
